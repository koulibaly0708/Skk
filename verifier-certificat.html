<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérifier un certificat — Solo Koumana Koulibaly</title>
<meta name="description" content="Vérifiez l'authenticité d'un certificat de réussite délivré par Solo Koumana Koulibaly à partir de son code de vérification.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --clay:#D98E3D;
    --paper:#F6F1E7;
    --charcoal:#2B2622;
    --sage:#4C6B54;
    --white:#FFFFFF;
    --line: rgba(27,42,74,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--charcoal);
    font-family:'Work Sans', sans-serif; font-size:16px; line-height:1.6;
    display:flex; flex-direction:column;
  }
  a{color:inherit;}
  .topbar{
    background:var(--ink); color:var(--paper); padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .topbar .brand{font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.02em;}
  .topbar .brand span{color:var(--clay);}
  .topbar a.back{
    color:var(--paper); border:1px solid rgba(246,241,231,.35); border-radius:20px;
    padding:7px 16px; font-size:.85rem; text-decoration:none;
  }
  .topbar a.back:hover{background:rgba(246,241,231,.14);}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .card{
    width:100%; max-width:480px; background:var(--white); border:1px solid var(--line);
    border-radius:10px; padding:36px 32px; box-shadow:0 12px 30px rgba(27,42,74,0.08);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--paper); background:var(--clay); display:inline-flex; padding:6px 16px; border-radius:999px; margin-bottom:16px;
  }
  h1{font-family:'Roboto',sans-serif; color:var(--ink); font-size:1.4rem; margin:0 0 10px;}
  .card p.lede{margin:0 0 24px; color:#5a5349; font-size:.95rem;}
  form{display:flex; flex-direction:column; gap:14px;}
  input[type="text"]{
    padding:14px 16px; border-radius:6px; border:1.5px solid var(--line); font-size:1.1rem;
    font-family:'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; text-align:center;
    background:var(--paper); color:var(--ink);
  }
  input[type="text"]:focus{outline:2.5px solid var(--clay); outline-offset:1px; border-color:var(--clay);}
  button{
    padding:13px 18px; border-radius:6px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    font-weight:600; font-size:.95rem; cursor:pointer; font-family:'Work Sans',sans-serif;
    transition:transform .18s ease, background .18s ease;
  }
  button:hover{transform:translateY(-2px); background:var(--charcoal);}
  button:disabled{opacity:.6; cursor:default; transform:none;}
  .result{margin-top:24px; display:none;}
  .result.show{display:block;}
  .result-ok{
    background:rgba(76,107,84,0.1); border:1px solid rgba(76,107,84,0.35); border-radius:8px; padding:18px 20px;
  }
  .result-ok .tag{
    display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--sage); font-size:.9rem; margin-bottom:10px;
  }
  .result-ok dl{margin:0;}
  .result-ok dt{font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:#8a8378; margin-top:10px;}
  .result-ok dt:first-child{margin-top:0;}
  .result-ok dd{margin:2px 0 0; font-weight:600; color:var(--ink); font-size:1.02rem;}
  .result-ko{
    background:rgba(179,64,42,0.08); border:1px solid rgba(179,64,42,0.25); border-radius:8px;
    padding:16px 18px; color:#b3402a; font-size:.92rem;
  }
  .footer-note{margin-top:22px; font-size:.85rem; color:#8a8378; text-align:center;}
  .footer-note a{color:var(--clay); font-weight:500; text-decoration:none;}
  .footer-note a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">SK<span>K</span>. — Vérification de certificat</span>
  <a class="back" href="index.html">&larr; Retour au site</a>
</div>

<main>
  <div class="card">
    <span class="eyebrow">Vérification</span>
    <h1>Vérifier un certificat de réussite</h1>
    <p class="lede">Entrez le code de vérification inscrit en bas du certificat pour confirmer son authenticité.</p>

    <form id="verifForm" novalidate>
      <input type="text" id="codeInput" name="code" placeholder="EX. SKK-7K3P9QRT" maxlength="20" autocomplete="off" required>
      <button type="submit" id="verifSubmitBtn">Vérifier</button>
    </form>

    <div class="result" id="resultZone"></div>

    <p class="footer-note">Vous êtes formateur et souhaitez proposer une formation ? <a href="catalogue-formations.html">Découvrez le catalogue</a></p>
  </div>
</main>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhdBcF37w7ZZBdTWVVVNaZE-MhZMtAdsU",
    authDomain: "mon-site-skkoulibaly.firebaseapp.com",
    databaseURL: "https://mon-site-skkoulibaly-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mon-site-skkoulibaly",
    storageBucket: "mon-site-skkoulibaly.firebasestorage.app",
    messagingSenderId: "367698551446",
    appId: "1:367698551446:web:15534cc2af8beda4ba58b7",
    measurementId: "G-QYLJJP5XKY"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);

  const form = document.getElementById('verifForm');
  const input = document.getElementById('codeInput');
  const submitBtn = document.getElementById('verifSubmitBtn');
  const resultZone = document.getElementById('resultZone');

  // Pré-remplissage si le code est passé dans l'URL (ex. lien direct ?code=SKK-XXXXXXXX)
  const paramsUrl = new URLSearchParams(window.location.search);
  const codeUrl = paramsUrl.get('code');
  if (codeUrl) input.value = codeUrl.trim().toUpperCase();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = input.value.trim().toUpperCase();
    if (!code) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Vérification…';
    resultZone.classList.remove('show');

    try {
      const snap = await get(ref(rtdb, 'certificats/' + code));
      if (!snap.exists()) {
        resultZone.innerHTML = '<div class="result-ko">Aucun certificat ne correspond à ce code. Vérifiez la saisie ou contactez-nous si vous pensez qu\'il s\'agit d\'une erreur.</div>';
      } else {
        const c = snap.val();
        const dateTexte = c.dateCompletion
          ? new Date(c.dateCompletion).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
          : '—';
        resultZone.innerHTML = '<div class="result-ok">'
          + '<span class="tag">✓ Certificat authentique</span>'
          + '<dl>'
          + '<dt>Titulaire</dt><dd>' + (c.nom || '—') + '</dd>'
          + '<dt>Formation</dt><dd>' + (c.formation || '—') + '</dd>'
          + '<dt>Date de réussite</dt><dd>' + dateTexte + '</dd>'
          + '</dl>'
          + '</div>';
      }
      resultZone.classList.add('show');
    } catch (err) {
      resultZone.innerHTML = '<div class="result-ko">Une erreur est survenue lors de la vérification. Réessayez dans un instant.</div>';
      resultZone.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Vérifier';
    }
  });
</script>

</body>
</html>
